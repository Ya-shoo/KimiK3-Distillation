[project]
name = "triage-distill"
version = "0.1.0"
description = "Distill Kimi K3 into a small, near-zero-cost support triage/escalation classifier."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pydantic>=2.8",
    "pyyaml>=6",
    "python-dotenv>=1",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "openai>=1.40",
    "httpx>=0.27",
]

[dependency-groups]
# Installed ONLY on the CUDA training box (RTX 4090). Do not sync on macOS.
# unsloth is installed separately per its own install matrix on the 4090.
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "trl>=0.9",
    "peft>=0.12",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
    "datasets>=3.0",
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_distill"]
